<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img" aria-labelledby="title description">
  <title id="title">Agents, with intent.</title>
  <desc id="description">An agent workflow connecting a user request to an orchestrator, tools, retrieval, human approval, and a validated response.</desc>
