          <rect x="0" y="0" width="224" height="58" rx="5" fill="#191917" stroke="#46443F" stroke-width="1" />
          <text x="14" y="23" fill="#EAE7E0" font-size="11.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">Service</text>
          <text x="70" y="23" fill="#928E85" font-size="11" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">docs-assistant</text>
          <text x="14" y="43" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">ClusterIP :80 → :8080</text>
        </g>


        <g transform="translate(16, 126)">
          <rect x="0" y="0" width="224" height="206" rx="5" fill="#191917" stroke="#46443F" stroke-width="1" />
          <text x="14" y="23" fill="#EAE7E0" font-size="11.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">Deployment</text>
          <text x="92" y="23" fill="#928E85" font-size="11" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">docs-assistant</text>


          <g transform="translate(12, 38)">
            <rect x="0" y="0" width="200" height="154" rx="4" fill="#141413" stroke="#2E2D2A" stroke-width="1" />
            <text x="12" y="21" fill="#EAE7E0" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">AI API Pods</text>
            <text x="188" y="21" text-anchor="end" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">2 replicas</text>

            <line x1="12" y1="31" x2="188" y2="31" stroke="#2E2D2A" stroke-width="1" />


            <text x="12" y="51" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">port: 8080 (http)</text>
            <text x="12" y="71" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">probes: /livez, /readyz</text>
            <text x="12" y="95" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">env: MODEL_ENDPOINT,</text>
            <text x="12" y="111" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">     MODEL_NAME</text>
            <text x="12" y="135" fill="#D97757" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">env: MODEL_API_KEY</text>
          </g>
        </g>


        <line x1="196" y1="92" x2="196" y2="161" stroke="#858177" stroke-width="1.15" marker-end="url(#arrow-muted)" />
        <text x="202" y="114" fill="#928E85" font-size="9" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">routes</text>
      </g>






      <path d="M 204 204 L 256 204 L 256 83 L 307 83" fill="none" stroke="#D97757" stroke-width="1.15" marker-end="url(#arrow-accent)" />
      <path d="M 204 204 L 307 204" fill="none" stroke="#D97757" stroke-width="1.15" marker-end="url(#arrow-accent)" />
      <text x="255" y="196" text-anchor="middle" fill="#928E85" font-size="9.5">reconciles</text>
      <text x="255" y="217" text-anchor="middle" fill="#928E85" font-size="9">&amp; watches</text>


      <line x1="234" y1="319" x2="319" y2="319" stroke="#858177" stroke-width="1.15" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
      <text x="276" y="311" text-anchor="middle" fill="#928E85" font-size="9.5" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">api-key</text>






