<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" id="aiapp-architecture-svg" viewBox="0 0 780 390" width="780" height="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="aiapp-architecture-title aiapp-architecture-description">
      <title id="aiapp-architecture-title">Kubernetes operator architecture for an AI application</title><desc id="aiapp-architecture-description">The AIApp reconciler watches the custom resource and updates its status. It manages an owned Deployment and ClusterIP Service. The Deployment manages application Pods through a ReplicaSet. Pods receive an API key from a separately supplied Secret and call an external model endpoint and application-managed retrieval dependencies.</desc><defs>
        <marker id="arrow-muted" viewBox="0 0 8 8" refX="6.8" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
          <path d="M 1.2 1.5 L 6.5 4 L 1.2 6.5" fill="none" stroke="#858177" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </marker>


        <marker id="arrow-accent" viewBox="0 0 8 8" refX="6.8" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
          <path d="M 1.2 1.5 L 6.5 4 L 1.2 6.5" fill="none" stroke="#D97757" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
      </defs>


      <rect width="780" height="390" rx="8" fill="#141413" />






      <g transform="translate(20, 30)">
        <rect x="0" y="0" width="214" height="106" rx="6" fill="rgba(217, 119, 87, 0.06)" stroke="#D97757" stroke-width="1.2" />
        <circle cx="15" cy="20" r="3.2" fill="#D97757" />
        <text x="25" y="24" fill="#EAE7E0" font-size="12" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">AIApp</text>
        <text x="68" y="24" fill="#928E85" font-size="11.5" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">docs-assistant</text>

        <line x1="14" y1="36" x2="200" y2="36" stroke="#2E2D2A" stroke-width="1" />

        <text x="14" y="54" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">spec: image, replicas, model,</text>
        <text x="14" y="70" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">      modelEndpoint, apiKeySecret</text>
        <text x="14" y="90" fill="#D97757" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">status: readyReplicas, conditions</text>
      </g>



      <line x1="106" y1="136" x2="106" y2="177" stroke="#D97757" stroke-width="1.15" marker-end="url(#arrow-accent)" />
      <text x="98" y="160" text-anchor="end" fill="#928E85" font-size="10">watches</text>


      <line x1="144" y1="180" x2="144" y2="140" stroke="#858177" stroke-width="1.15" stroke-dasharray="2.5 2.5" marker-end="url(#arrow-muted)" />
      <text x="152" y="160" fill="#928E85" font-size="10">status</text>


      <g transform="translate(46, 180)">
        <rect x="0" y="0" width="158" height="48" rx="6" fill="#191917" stroke="#46443F" stroke-width="1" />
        <text x="79" y="21" text-anchor="middle" fill="#EAE7E0" font-size="11.5" font-weight="600">Operator</text>
        <text x="79" y="37" text-anchor="middle" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">AIAppReconciler</text>
      </g>


      <g transform="translate(20, 272)">
        <rect x="0" y="0" width="214" height="76" rx="6" fill="#191917" stroke="#46443F" stroke-width="1" stroke-dasharray="4 3" />
        <text x="14" y="23" fill="#EAE7E0" font-size="11.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">Secret</text>
        <text x="64" y="23" fill="#928E85" font-size="11" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">model-credentials</text>
        <text x="14" y="44" fill="#928E85" font-size="10.5">Supplied separately</text>
        <text x="14" y="61" fill="#928E85" font-size="10" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">not owned by AIApp</text>
      </g>




      <g transform="translate(294, 20)">

        <rect x="0" y="0" width="256" height="350" rx="7" fill="rgba(255, 255, 255, 0.012)" stroke="#2E2D2A" stroke-width="1" stroke-dasharray="5 4" />
        <text x="16" y="21" fill="#928E85" font-size="9.5" letter-spacing="0.06em" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">OWNED BY AIAPP</text>


