        <text x="14" y="44" fill="#928E85" font-size="9.5" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">https://.../v1</text>
      </g>


      <g transform="translate(592, 256)">
        <rect x="0" y="0" width="168" height="62" rx="5" fill="#191917" stroke="#2E2D2A" stroke-width="1" />
        <text x="14" y="24" fill="#EAE7E0" font-size="11" font-weight="600">Retrieval Dependencies</text>
