<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img" aria-labelledby="title description">
  <title id="title">Ship. Observe. Improve.</title>
  <desc id="description">A delivery and observability diagram showing commit, build, test, and deployment stages linked to metrics, logs, traces, and a feedback loop.</desc>
  <defs>
